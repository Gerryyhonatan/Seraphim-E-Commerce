services:
  postgres:
    image: postgres:16
    container_name: postgres_db
    environment:
      POSTGRES_USER: ${DATABASE_S_USER}
      POSTGRES_PASSWORD: ${DATABASE_S_PASSWORD}
      POSTGRES_DB: ${DATABASE_S_NAME}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:8
    container_name: redis_cache
    ports:
      - "6379:6379"

  backend:
    build: ./server
    container_name: backend
    environment:
      DATABASE_S_HOST: postgres
      DATABASE_S_PORT: ${DATABASE_S_PORT}
      DATABASE_S_USER: ${DATABASE_S_USER}
      DATABASE_S_NAME: ${DATABASE_S_NAME}
      DATABASE_S_PASSWORD: ${DATABASE_S_PASSWORD}
      DATABASE_S_MIN_SIZE: ${DATABASE_S_MIN_SIZE}
      DATABASE_S_MAX_SIZE: ${DATABASE_S_MAX_SIZE}
      PYTHONUNBUFFERED: 1
    depends_on:
      - postgres
      - redis
    ports:
      - "5005:8000"
volumes:
  pgdata:
