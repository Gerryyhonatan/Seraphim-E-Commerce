version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: postgres_db
    environment:
      POSTGRES_USER: ${DATABASE_S_USER}
      POSTGRES_PASSWORD: ${DATABASE_S_PASSWORD}
      POSTGRES_DB: ${DATABASE_S_NAME}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:8
    container_name: redis_cache
    ports:
      - "6379:6379"

volumes:
  pgdata:
